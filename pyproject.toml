[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-chaos-simulator"
version = "0.1.0"
description = "Adaptive AI Traffic Control Simulation with SUMO and Reinforcement Learning"
authors = [{ name = "Traffic Chaos Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "traci>=1.20.0",
    "sumolib>=1.20.0",
    "gymnasium>=0.29.0",
    "torch>=2.0.0",
    "stable-baselines3>=2.2.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.30.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
